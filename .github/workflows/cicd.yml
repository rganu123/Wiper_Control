name: cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q .github/skills/unit-test-spec-generator/scripts

      - name: Run Logical-Unit Tests
        run: python .github/skills/unit-test-spec-generator/scripts/csv_spec.py self-test

  code-quality:
    name: Code Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scan Tools
        run: python -m pip install ruff==0.11.13 bandit==1.8.3

      - name: Lint Python
        run: ruff check --no-respect-gitignore .github/skills/unit-test-spec-generator/scripts

      - name: Scan Python Security
        if: ${{ !cancelled() }}
        working-directory: .github/skills/unit-test-spec-generator/scripts
        run: bandit csv_spec.py

  deploy:
    name: Deploy to EC2
    needs: [build-and-test, code-quality]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write Deployment File over SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set the EC2_HOST repository secret}"
          : "${EC2_USER:?Set the EC2_USER repository secret}"
          : "${EC2_SSH_PRIVATE_KEY:?Set the EC2_SSH_PRIVATE_KEY repository secret}"

          umask 077
          key_file=$(mktemp "${RUNNER_TEMP}/ec2-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          unset EC2_SSH_PRIVATE_KEY

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o GlobalKnownHostsFile=/dev/null \
            -- "${EC2_USER}@${EC2_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf 'hello world\nTimestamp (UTC): %s\n' "$timestamp" > /home/ubuntu/deployment.txt
          test -s /home/ubuntu/deployment.txt
          grep -Fxq 'hello world' /home/ubuntu/deployment.txt
          REMOTE