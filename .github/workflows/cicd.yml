name: cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q .github/skills/unit-test-spec-generator/scripts

      - name: Run Logical-Unit Tests
        run: python .github/skills/unit-test-spec-generator/scripts/csv_spec.py self-test

  code-quality:
    name: Code Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scan Tools
        run: python -m pip install ruff==0.11.13 bandit==1.8.3

      - name: Lint Python
        run: ruff check --no-respect-gitignore .github/skills/unit-test-spec-generator/scripts

      - name: Scan Python Security
        if: ${{ !cancelled() }}
        working-directory: .github/skills/unit-test-spec-generator/scripts
        run: bandit csv_spec.py